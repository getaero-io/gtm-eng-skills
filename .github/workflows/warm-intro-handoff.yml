name: Warm intro engineering handoff
on:
  pull_request:
    paths: ['engineering/warm-intro-scoring/**', '.github/workflows/warm-intro-handoff.yml']
  push:
    paths: ['engineering/warm-intro-scoring/**', '.github/workflows/warm-intro-handoff.yml']
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: python engineering/warm-intro-scoring/plays/check_all.py
      - name: Verify package manifest and extracted demo
        run: |
          python engineering/warm-intro-scoring/scripts/package-skill.py --output "$RUNNER_TEMP/warm-intro.tar.gz"
          mkdir "$RUNNER_TEMP/warm-intro-package"
          tar -xzf "$RUNNER_TEMP/warm-intro.tar.gz" -C "$RUNNER_TEMP/warm-intro-package"
          bun "$RUNNER_TEMP/warm-intro-package/warm-intro-scoring/scripts/recipe-demo.ts" "$RUNNER_TEMP/warm-intro-demo"

name: Warm intro engineering handoff
on:
  pull_request:
    paths: ['engineering/warm-intro-scoring/**', '.github/workflows/warm-intro-handoff.yml']
  push:
    paths: ['engineering/warm-intro-scoring/**', '.github/workflows/warm-intro-handoff.yml']
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python engineering/warm-intro-scoring/check_all.py

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1919FF"/></marker></defs>
<rect width="1600" height="900" fill="#FCFCFD" data-overlap-ignore="true"/>
<text class="deepline-mono" x="80" y="90" font-size="18" fill="#676173">deepline / states and plays</text>
<g class="deepline-sans" fill="#201D23">
<text x="80" y="170" font-size="60" font-weight="500">States show progress. Plays do the work.</text>
<text x="80" y="225" font-size="26" fill="#676173">Start with five experts. Turn repeated steps into versioned workflows.</text>
<text x="80" y="322" font-size="23" fill="#676173">Current state</text>
<text x="470" y="322" font-size="23" fill="#1919FF">Play: reusable work</text>
<text x="1230" y="322" font-size="23" fill="#676173">Next state</text>
<rect x="80" y="350" width="310" height="220" rx="6" fill="#FCFCFD" stroke="#E0E0E9"/>
<rect x="470" y="350" width="680" height="220" rx="6" fill="#E5E5FF" stroke="#1919FF"/>
<rect x="1230" y="350" width="290" height="220" rx="6" fill="#FCFCFD" stroke="#E0E0E9"/>
<text x="105" y="410" font-size="30" font-weight="500">Candidate</text>
<text x="105" y="470" font-size="23" fill="#676173">Profile and project brief</text>
<text x="105" y="507" font-size="23" fill="#676173">What we know now</text>
<text x="500" y="410" font-size="30" font-weight="500">Research and assess fit</text>
<text x="500" y="470" font-size="24" fill="#676173">Get contact data. Find project evidence.</text>
<text x="500" y="507" font-size="24" fill="#676173">Apply your rubric. Record the reasons.</text>
<text x="1255" y="410" font-size="28" font-weight="500">Qualified or waiting</text>
<text x="1255" y="470" font-size="23" fill="#676173">Advance only when</text>
<text x="1255" y="507" font-size="23" fill="#676173">the rule passes.</text>
<path d="M 402 460 H 455" fill="none" stroke="#1919FF" stroke-width="2" marker-end="url(#arrow)" data-connector="true"/>
<path d="M 1162 460 H 1215" fill="none" stroke="#1919FF" stroke-width="2" marker-end="url(#arrow)" data-connector="true"/>
<text x="80" y="650" font-size="28" font-weight="500">You define the rule. The coding agent builds the Play.</text>
<text x="80" y="698" font-size="24" fill="#676173">GitHub stores the workflow. Deepline runs it and records the result.</text>
<text x="80" y="780" font-size="22" fill="#676173">Goal: maximize activated and retained experts.</text>
<text x="80" y="820" font-size="22" fill="#676173">Illustrative transition. Task-fit scoring and project research are proposed extensions.</text>
</g></svg>

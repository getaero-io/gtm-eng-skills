<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 530"><rect width="1240" height="530" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#495057"/></marker></defs><text x="620" y="71" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#343a40">Start with five experts</text><text x="620" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#343a40">Learn the process. Then automate what repeats.</text><rect x="40" y="180" width="260" height="110" rx="12" fill="#e7f5ff" stroke="#495057" stroke-width="2"/><text x="170" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#343a40">Find five experts</text><text x="170" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#343a40">One record per person</text><polyline points="310,235 335,235" fill="none" stroke="#343a40" stroke-width="2"  marker-end="url(#a)"/><rect x="340" y="180" width="260" height="110" rx="12" fill="#fff4e6" stroke="#495057" stroke-width="2"/><text x="470" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#343a40">Agree on work</text><text x="470" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#343a40">Check fit, time and terms</text><polyline points="610,235 635,235" fill="none" stroke="#343a40" stroke-width="2"  marker-end="url(#a)"/><rect x="640" y="180" width="260" height="110" rx="12" fill="#ebfbee" stroke="#495057" stroke-width="2"/><text x="770" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#343a40">Get useful work</text><text x="770" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#343a40">Review the result</text><polyline points="910,235 935,235" fill="none" stroke="#343a40" stroke-width="2"  marker-end="url(#a)"/><rect x="940" y="180" width="260" height="110" rx="12" fill="#ebfbee" stroke="#495057" stroke-width="2"/><text x="1070" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#343a40">Invite them back</text><text x="1070" y="266" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#343a40">Offer a suitable next task</text><polyline points="1070,305 1070,375 470,375 470,305" fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#a)"/><text x="770" y="416" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#343a40">Use what you learned</text><text x="620" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#343a40">Goal: useful first contributions and repeat contributions</text></svg>